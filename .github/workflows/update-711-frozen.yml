# 每天自動更新「可取冷凍的 7-11 門市」名單（新開門市、新增冷凍服務的門市會自動加入，關店會自動移除）
name: 更新 7-11 冷凍門市

on:
  schedule:
    - cron: '17 19 * * *'   # 每天台灣時間 03:17
  workflow_dispatch:         # 也可以在 GitHub 的 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 下載並整理冷凍門市
        run: node scripts/build-711-frozen.mjs
      - name: 有變動才存檔
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/711-frozen.json
          if git diff --cached --quiet; then
            echo "門市名單沒有變動"
          else
            git commit -m "自動更新 7-11 冷凍門市名單"
            git push
          fi
